name: Feature Request
description: Propose a new feature, improvement, or architectural enhancement for PortProbe
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature for PortProbe! Please describe the use case and how it benefits SRE, DevOps, or Network Engineering workflows.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Use Case
      description: Is your feature request related to a specific operational challenge or limitation?
      placeholder: "When diagnosing complex multi-cloud routing..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Behavior
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
  - type: dropdown
    id: scope
    attributes:
      label: Feature Scope
      options:
        - "CLI / Flag Enhancement"
        - "Configuration File (TOML) Option"
        - "Transport Security / TLS / mTLS"
        - "Metrics & Observability"
        - "Operating System Integration (systemd, Windows Service)"
        - "Documentation & Examples"
