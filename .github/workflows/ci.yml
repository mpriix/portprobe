name: PortProbe CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-and-format:
    name: Code Formatting & Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check code formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Unit & Regression Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo tests
        run: cargo test --all-targets --verbose

  security:
    name: Supply Chain & Security Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit, deny & SBOM tools (prebuilt binaries)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-cyclonedx
      - name: Run cargo audit
        run: cargo audit
      - name: Run cargo deny check
        run: cargo deny check
      - name: Generate CycloneDX SBOM (Finding SEC-2026-24)
        run: cargo cyclonedx --format json --output-pattern "portprobe-sbom.cdx.json"
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portprobe-sbom
          path: portprobe-sbom.cdx.json

  container-security:
    name: Container Vulnerability Scan (SEC-FIND-A14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hardened deployment container
        run: docker build -t portprobe:ci .
      - name: Run Trivy container vulnerability scanner
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: 'portprobe:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  security-regression-gates:
    name: Security & Invariant Regression Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Zero Unsafe Blocks in Application Source
        run: |
          if grep -rn "unsafe " src/; then
            echo "REGRESSION: Unsafe block detected in src/"
            exit 1
          fi
      - name: Verify Constant-Time Equality for Sensitive Tokens
        run: |
          if grep -rn "== required_token" src/; then
            echo "REGRESSION: Variable-time token comparison detected"
            exit 1
          fi

  release-provenance:
    name: Binary Provenance & Attestation (SEC-FIND-A13)
    runs-on: ubuntu-latest
    needs: [test, security, lint-and-format]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Verify Cosign Installation
        run: cosign version
