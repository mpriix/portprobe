<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="PortProbe Enterprise Documentation: Asynchronous TCP connectivity verification daemon and client probe written in safe Rust.">
  <title>PortProbe Enterprise Documentation</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">

  <!-- Core & Theme Stylesheets -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Highlight.js Syntax Theme (Atom One Dark) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">

  <!-- Pre-Theme Script to prevent flash of wrong theme -->
  <script>
    (function () {
      const saved = localStorage.getItem('portprobe_docs_theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>

<body>

  <!-- Top Application Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="icon-btn menu-toggle-btn" id="mobile-menu-btn" aria-label="Toggle navigation drawer">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12" />
          <line x1="4" x2="20" y1="6" y2="6" />
          <line x1="4" x2="20" y1="18" y2="18" />
        </svg>
      </button>

      <a href="#/README.md" class="brand-link">
        <img src="assets/images/logo.svg" alt="PortProbe Logo" class="brand-logo">
        <span class="brand-text">PortProbe<span class="dot">.</span></span>
      </a>

      <span class="version-badge">v2.0.0</span>
    </div>

    <div class="header-center">
      <button class="search-trigger-btn" id="header-search-btn" aria-label="Search documentation">
        <span class="search-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          Search documentation...
        </span>
        <kbd class="kbd-shortcut">Ctrl K</kbd>
      </button>
    </div>

    <div class="header-right">
      <!-- Mobile Search Button -->
      <button class="icon-btn mobile-search-btn" id="mobile-search-btn" title="Search documentation" aria-label="Search documentation">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
      </button>

      <!-- Theme Switcher -->
      <button class="icon-btn" id="theme-toggle-btn" title="Toggle color theme" aria-label="Toggle color theme">
        <span id="theme-toggle-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" />
            <path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" />
            <path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" />
            <path d="m19.07 4.93-1.41 1.41" />
          </svg>
        </span>
      </button>

      <!-- GitHub Repository Link -->
      <a href="https://github.com/portprobe/portprobe" target="_blank" rel="noopener noreferrer" class="icon-btn"
        title="View Source on GitHub" aria-label="GitHub Repository">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
          <path d="M9 18c-4.51 2-5-2-7-2" />
        </svg>
      </a>
    </div>
  </header>

  <!-- Mobile Drawer Backdrop -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- Three-Column Main Container -->
  <div class="app-container">

    <!-- Left Sidebar: Documentation Navigation -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-drawer-header">
        <div class="brand-link">
          <img src="assets/images/logo.svg" alt="PortProbe Logo" class="brand-logo">
          <span class="brand-text">PortProbe<span class="dot">.</span></span>
        </div>
        <button class="icon-btn sidebar-close-btn" id="sidebar-close-btn" aria-label="Close navigation menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="nav-filter-box">
        <input type="text" id="nav-filter-input" class="nav-filter-input" placeholder="Filter navigation..."
          aria-label="Filter navigation menu">
      </div>
      <nav id="sidebar-nav-container">
        <!-- Rendered dynamically by navigation.js -->
      </nav>
    </aside>

    <!-- Center Column: Main Content -->
    <main class="app-main">
      <article class="content-wrapper">
        <!-- Breadcrumb Navigation -->
        <nav class="doc-breadcrumbs" id="doc-breadcrumbs" aria-label="Breadcrumbs">
          <!-- Populated by navigation.js -->
        </nav>

        <!-- Landing Page Hero Container (Active on README.md) -->
        <div id="landing-hero-container"></div>

        <!-- Document Metadata Header Card -->
        <div id="doc-meta-container"></div>

        <!-- Rendered Markdown Body -->
        <div class="markdown-body" id="markdown-content">
          <div style="padding: 2rem 0; text-align: center; color: var(--color-text-muted);">
            Loading PortProbe documentation...
          </div>
        </div>

        <!-- Previous / Next Navigation Cards -->
        <div class="doc-footer-nav" id="doc-footer-nav">
          <!-- Populated by navigation.js -->
        </div>
      </article>
    </main>

    <!-- Right Column: Table of Contents -->
    <aside class="app-toc" id="app-toc-container">
      <div class="toc-header">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="21" x2="3" y1="6" y2="6" />
          <line x1="15" x2="3" y1="12" y2="12" />
          <line x1="17" x2="3" y1="18" y2="18" />
        </svg>
        <span>On This Page</span>
      </div>
      <ul class="toc-list" id="toc-list">
        <!-- Populated dynamically by toc.js -->
      </ul>
      <button class="back-to-top-btn" id="back-to-top-btn" title="Back to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m18 15-6-6-6 6" />
        </svg>
        <span>Back to top</span>
      </button>
    </aside>

  </div>

  <!-- Client-Side Search Modal -->
  <div class="search-modal-backdrop" id="search-modal-backdrop">
    <div class="search-modal">
      <div class="search-modal-header">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          style="color: var(--color-text-muted);">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input type="text" id="search-modal-input" class="search-modal-input"
          placeholder="Search titles, sections, commands, or topics..." autocomplete="off">
        <button class="search-modal-close-btn" id="search-modal-close-btn" title="Close search (Esc)">
          <kbd class="kbd-shortcut">ESC</kbd>
        </button>
      </div>
      <div class="search-modal-results" id="search-modal-results">
        <!-- Search results injected here -->
      </div>
      <div class="search-modal-footer">
        <span>Navigate: <kbd class="kbd-shortcut">↑</kbd> <kbd class="kbd-shortcut">↓</kbd></span>
        <span>Select: <kbd class="kbd-shortcut">Enter</kbd></span>
        <span>Close: <kbd class="kbd-shortcut">Esc</kbd></span>
      </div>
    </div>
  </div>

  <!-- Third-Party Vendor CDNs -->
  <!-- Marked.js Markdown Parser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <!-- Highlight.js Syntax Highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/rust.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/toml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/ini.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>

  <!-- Mermaid.js for Architecture Diagrams -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>

  <!-- PortProbe Static Application Scripts -->
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/docs-bundle.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/markdown-renderer.js"></script>
  <script src="assets/js/search.js"></script>
  <script src="assets/js/toc.js"></script>
  <script src="assets/js/app.js"></script>

</body>

</html>
