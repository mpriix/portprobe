[package]
name = "portprobe"
version = "2.0.0"
edition = "2021"
description = "Secure TCP connectivity testing utility for SRE teams"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mpriix/portprobe"
documentation = "https://github.com/mpriix/portprobe#readme"
keywords = ["networking", "tcp", "sre", "connectivity", "probe"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "portprobe"
path = "src/main.rs"

[lib]
name = "portprobe"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = [
    "net",
    "io-util",
    "time",
    "sync",
    "rt-multi-thread",
    "macros",
    "signal",
] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"

tracing-subscriber = {
    version = "0.3",
    features = ["env-filter", "fmt", "time", "json"]
}

serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pki-types = { version = "1", features = ["std"] }

time = {
    version = "0.3",
    features = ["local-offset", "formatting"]
}

socket2 = "0.6"
subtle = "2.6"
ring = "0.17"

[target.'cfg(unix)'.dependencies]
privdrop = "0.5"
nix = { version = "0.30", default-features = false, features = ["user"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[[bench]]
name = "connection_benchmark"
harness = false

[[bench]]
name = "concurrency_benchmark"
harness = false

[[bench]]
name = "throughput_benchmark"
harness = false

